name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release version and notes
        run: ./Development/scripts/check-repository.ps1 -ReleaseTag $env:GITHUB_REF_NAME
      - name: Set up verified dependencies
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./Development/scripts/setup.ps1
      - name: Run CPU and media checks
        run: ./Development/scripts/test.ps1
      - name: Build portable app
        run: ./Development/scripts/build.ps1 -Zip
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $editorVersion = $env:GITHUB_REF_NAME.Substring(1)
          gh release view $env:GITHUB_REF_NAME --json url
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'The release already exists; its assets and description remain unchanged.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Simple Video Editor $editorVersion" --notes-file "release-notes/$editorVersion.md" Releases/SimpleVideoEditor-win-x64.zip Releases/SimpleVideoEditor-win-x64.zip.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
