name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version and notes
        run: ./Development/scripts/check-repository.ps1 -ReleaseTag $env:GITHUB_REF_NAME
      - name: Set up verified dependencies
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./Development/scripts/setup.ps1
      - name: Run CPU and media checks
        run: ./Development/scripts/test.ps1
      - name: Build portable app
        run: ./Development/scripts/build.ps1 -Zip
      - name: Verify portable package
        run: ./Development/scripts/verify-package.ps1
      - name: Check packaging safeguards
        run: ./Development/scripts/test-packaging.ps1
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $editorVersion = $env:GITHUB_REF_NAME.Substring(1)
          gh release view $env:GITHUB_REF_NAME --json url
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'The release already exists; its assets and description remain unchanged.'
            exit 0
          }
          $editorPackage = "Releases/SimpleVideoEditor-$editorVersion-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Simple Video Editor $editorVersion" --notes-file "release-notes/$editorVersion.md" $editorPackage ($editorPackage + '.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
