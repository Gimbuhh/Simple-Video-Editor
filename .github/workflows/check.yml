name: Windows checks

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check repository metadata
        run: ./Development/scripts/check-repository.ps1
      - name: Set up verified dependencies
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./Development/scripts/setup.ps1
      - name: Run CPU and media checks
        run: ./Development/scripts/test.ps1
      - name: Build portable app
        run: ./Development/scripts/build.ps1 -Zip
      - name: Verify portable package
        run: ./Development/scripts/verify-package.ps1
      - name: Check packaging safeguards
        run: ./Development/scripts/test-packaging.ps1
      - name: Keep verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-results
          path: |
            Development/artifacts/verification/results.json
            Development/artifacts/package-verification/results.json
          retention-days: 7
          if-no-files-found: warn
      - name: Keep portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SimpleVideoEditor-win-x64
          path: |
            Releases/SimpleVideoEditor-*-win-x64.zip
            Releases/SimpleVideoEditor-*-win-x64.zip.sha256
          retention-days: 7
          if-no-files-found: error
